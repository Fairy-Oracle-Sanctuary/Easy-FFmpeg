name: Deploy Linux

# 仅当 push 的提交消息包含 [deploy linux] 时才打包
# 例：git commit -m "feat: 新增功能 [deploy linux]"
on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # 判断最新一条提交消息是否含 [deploy linux]
    if: contains(github.event.head_commit.message, '[deploy linux]')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf binutils build-essential python3-dev ruby ruby-dev rubygems

      - name: Install fpm
        run: sudo gem install fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get version
        # 从 app/common/setting.py 读取 VERSION，避免硬编码
        id: version
        run: echo "version=$(python3 -c 'from app.common.setting import VERSION; print(VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python3 deploy.py

      - name: Prepare package root
        run: |
          mkdir -p package/opt/Easy-FFmpeg
          cp -a dist/Easy-FFmpeg.dist/. package/opt/Easy-FFmpeg/
          # 动态探测实际主程序名：Nuitka 有同名冲突时会生成 Easy-FFmpeg.bin
          # 而不是 Easy-FFmpeg，硬编码会写出失效的启动脚本
          if [ -f dist/Easy-FFmpeg.dist/Easy-FFmpeg ]; then
            MAIN_BIN=Easy-FFmpeg
          elif [ -f dist/Easy-FFmpeg.dist/Easy-FFmpeg.bin ]; then
            MAIN_BIN=Easy-FFmpeg.bin
          else
            echo "ERROR: main binary not found in dist/Easy-FFmpeg.dist/"
            ls -l dist/Easy-FFmpeg.dist/
            exit 1
          fi
          echo "Main binary: ${MAIN_BIN}"
          # 创建启动脚本（方便 /usr/bin 软链）
          mkdir -p package/usr/bin
          cat > package/usr/bin/easy-ffmpeg << EOF
          #!/bin/bash
          exec /opt/Easy-FFmpeg/${MAIN_BIN} "\$@"
          EOF
          chmod +x package/usr/bin/easy-ffmpeg
          # Debian 规范：DEP-5 machine-readable 格式的 copyright 文件
          # 软件中心（GNOME Software / Ubuntu Software）靠它识别许可证，简单复制 LICENSE 会显示 unknown
          mkdir -p package/usr/share/doc/easy-ffmpeg
          cat > package/usr/share/doc/easy-ffmpeg/copyright << 'EOF'
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: Easy FFmpeg
          Upstream-Contact: Fairy-Oracle-Sanctuary
          Source: https://github.com/Fairy-Oracle-Sanctuary/Easy-FFmpeg

          Files: *
          Copyright: 2024-2026 Fairy-Oracle-Sanctuary and contributors
          License: GPL-3.0-or-later

          License: GPL-3.0-or-later
           This program is free software: you can redistribute it and/or modify
           it under the terms of the GNU General Public License as published by
           the Free Software Foundation, either version 3 of the License, or
           (at your option) any later version.
           .
           This program is distributed in the hope that it will be useful,
           but WITHOUT ANY WARRANTY; without even the implied warranty of
           MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
           GNU General Public License for more details.
           .
           You should have received a copy of the GNU General Public License
           along with this program.  If not, see <https://www.gnu.org/licenses/>.
           .
           On Debian systems, the complete text of the GNU General
           Public License version 3 can be found in "/usr/share/common-licenses/GPL-3".
          EOF
          # 应用菜单入口：.desktop 文件 + 图标（否则软件中心看不到应用，只能命令行启动）
          mkdir -p package/usr/share/applications package/usr/share/pixmaps
          cat > package/usr/share/applications/easy-ffmpeg.desktop << 'EOF'
          [Desktop Entry]
          Name=Easy FFmpeg
          Comment=Simple FFmpeg GUI / tool
          Exec=easy-ffmpeg
          Icon=easy-ffmpeg
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;Audio;
          StartupNotify=true
          EOF
          cp app/resource/images/logo.png package/usr/share/pixmaps/easy-ffmpeg.png

      - name: Package (deb + rpm)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 打 deb 包（声明依赖 ffmpeg，安装时自动拉取；--license 防止软件中心显示 unknown）
          fpm -s dir -t deb \
            -n easy-ffmpeg \
            -v "${VERSION}" \
            --architecture ${{ matrix.deb_arch }} \
            --description "Easy FFmpeg - Simple FFmpeg GUI / tool" \
            --url "https://github.com/Fairy-Oracle-Sanctuary/Easy-FFmpeg" \
            --maintainer "Easy FFmpeg" \
            --license "GPL-3.0-or-later" \
            --depends ffmpeg \
            --prefix / \
            -C package \
            -p dist/Easy-FFmpeg-v${VERSION}-Linux-${{ matrix.arch }}.deb \
            .

          # 打 rpm 包（声明依赖 ffmpeg，安装时自动拉取）
          fpm -s dir -t rpm \
            -n easy-ffmpeg \
            -v "${VERSION}" \
            --architecture ${{ matrix.rpm_arch }} \
            --description "Easy FFmpeg - Simple FFmpeg GUI / tool" \
            --url "https://github.com/Fairy-Oracle-Sanctuary/Easy-FFmpeg" \
            --maintainer "Easy FFmpeg" \
            --license "GPL-3.0-or-later" \
            --depends ffmpeg \
            --prefix / \
            -C package \
            -p dist/Easy-FFmpeg-v${VERSION}-Linux-${{ matrix.arch }}.rpm \
            .

          # 只保留软件包，清理临时目录
          rm -rf package

      - name: Upload artifacts
        # 上传软件包：deb / rpm
        uses: actions/upload-artifact@v4
        with:
          name: Easy-FFmpeg-linux-${{ matrix.arch }}
          path: |
            dist/Easy-FFmpeg-v*-Linux-${{ matrix.arch }}.deb
            dist/Easy-FFmpeg-v*-Linux-${{ matrix.arch }}.rpm
          retention-days: 30
