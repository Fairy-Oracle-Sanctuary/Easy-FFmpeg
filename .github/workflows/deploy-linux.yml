name: Deploy Linux

# 仅当 push 的提交消息包含 [deploy linux] 时才打包
# 例：git commit -m "feat: 新增功能 [deploy linux]"
on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # 判断最新一条提交消息是否含 [deploy linux]
    if: contains(github.event.head_commit.message, '[deploy linux]')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf binutils build-essential python3-dev ruby ruby-dev rubygems

      - name: Install fpm
        run: sudo gem install fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get version
        # 从 app/common/setting.py 读取 VERSION，避免硬编码
        id: version
        run: echo "version=$(python3 -c 'from app.common.setting import VERSION; print(VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: python3 deploy.py

      - name: Prepare package root
        run: |
          mkdir -p package/opt/Easy-FFmpeg
          cp -a dist/Easy-FFmpeg.dist/. package/opt/Easy-FFmpeg/
          # 创建启动脚本（方便 /usr/bin 软链）
          mkdir -p package/usr/bin
          cat > package/usr/bin/easy-ffmpeg << 'EOF'
          #!/bin/bash
          exec /opt/Easy-FFmpeg/Easy-FFmpeg "$@"
          EOF
          chmod +x package/usr/bin/easy-ffmpeg

      - name: Package (deb + rpm)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 打 deb 包（声明依赖 ffmpeg，安装时自动拉取）
          fpm -s dir -t deb \
            -n easy-ffmpeg \
            -v "${VERSION}" \
            --architecture ${{ matrix.deb_arch }} \
            --description "Easy FFmpeg - Simple FFmpeg GUI / tool" \
            --url "https://github.com/Fairy-Oracle-Sanctuary/Easy-FFmpeg" \
            --maintainer "Easy FFmpeg" \
            --depends ffmpeg \
            --prefix / \
            -C package \
            -p dist/easy-ffmpeg_${VERSION}_${{ matrix.deb_arch }}.deb \
            .

          # 打 rpm 包（声明依赖 ffmpeg，安装时自动拉取）
          fpm -s dir -t rpm \
            -n easy-ffmpeg \
            -v "${VERSION}" \
            --architecture ${{ matrix.rpm_arch }} \
            --description "Easy FFmpeg - Simple FFmpeg GUI / tool" \
            --url "https://github.com/Fairy-Oracle-Sanctuary/Easy-FFmpeg" \
            --maintainer "Easy FFmpeg" \
            --depends ffmpeg \
            --prefix / \
            -C package \
            -p dist/easy-ffmpeg-${VERSION}-1.${{ matrix.rpm_arch }}.rpm \
            .

          # 只保留软件包，清理临时目录
          rm -rf package

      - name: Upload artifacts
        # 上传软件包：deb / rpm
        uses: actions/upload-artifact@v4
        with:
          name: Easy-FFmpeg-${{ matrix.arch }}
          path: |
            dist/easy-ffmpeg_*.deb
            dist/easy-ffmpeg-*.rpm
          retention-days: 30
